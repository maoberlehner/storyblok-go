{{define "customers_logos"}}
<section {{editable .}} class="customers-logos">
  {{with .Headline}}<h2 class="customers-logos__headline">{{.}}</h2>{{end}}
  <div class="customers-logos__marquee">
    <div class="customers-logos__track">
      <ul class="customers-logos__list">
        {{range .LogoItems}}<li {{editable .}} class="customers-logos__item">{{template "logo_image" .}}</li>{{end}}
      </ul>
      {{range .HiddenCopies}}
      <ul class="customers-logos__list" aria-hidden="true">
        {{range $.LogoItems}}<li class="customers-logos__item">{{template "logo_image" .}}</li>{{end}}
      </ul>
      {{end}}
    </div>
  </div>
  {{with .CTA}}<div class="customers-logos__cta">{{renderAll .}}</div>{{end}}
</section>
{{end}}
