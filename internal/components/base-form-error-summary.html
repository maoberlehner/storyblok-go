{{define "base-form-error-summary" -}}
<div class="base-form-error-summary" id="{{.ID}}" tabindex="-1" autofocus>
  <h3 class="base-form-error-summary__title">There is a problem</h3>
  <ul class="base-form-error-summary__list">
    {{- range .Fields}}
    <li><a href="#{{.ID}}">{{.Error}}</a></li>
    {{- end}}
  </ul>
</div>
{{- end}}
