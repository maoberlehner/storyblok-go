{{define "layout" -}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  {{- /* Keeps browsers from requesting /favicon.ico, which would be looked up as a story. */}}
  <link rel="icon" href="data:,">
  {{- with .Description}}
  <meta name="description" content="{{.}}">
  {{- end}}
  {{.Head}}
  <meta name="htmx-config" content='{"includeIndicatorCSS": false}'>
  <script src="{{.HTMXURL}}" defer></script>
  {{- with .ScriptURL}}
  <script src="{{.}}" defer></script>
  {{- end}}
  {{- with .DevToolbar}}
  <link rel="stylesheet" href="/assets/dev-toolbar.css">
  <script src="/assets/dev-toolbar.js" data-space-id="{{.SpaceID}}" data-story-id="{{.StoryID}}" defer></script>
  {{- end}}
  {{- if .Preview}}
  <script src="https://app.storyblok.com/f/storyblok-v2-latest.js" defer></script>
  <script src="https://unpkg.com/idiomorph@0.8.0/dist/idiomorph.min.js" defer></script>
  <script src="/assets/preview.js" data-resolve-relations="{{join .ResolveRelations ","}}" defer></script>
  {{- end}}
</head>
<body>
  <main id="main" data-preview-root>{{.Body}}</main>
</body>
</html>
{{- end}}
