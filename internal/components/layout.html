{{define "layout" -}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  {{with .Description}}<meta name="description" content="{{.}}">{{end}}
  {{with .Image.Filename}}<meta property="og:image" content="{{.}}">{{end}}
  <link rel="preload" href="/assets/fonts/ABCMarfa-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/ABCMarfa-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap">
  <link rel="stylesheet" href="{{.StylesheetURL}}">
  {{- with .DevToolbar}}
  <link rel="stylesheet" href="/assets/dev-toolbar.css">
  <script src="/assets/dev-toolbar.js" data-space-id="{{.SpaceID}}" data-story-id="{{.StoryID}}" defer></script>
  {{- end}}
  {{- if .Preview}}
  <script src="https://app.storyblok.com/f/storyblok-v2-latest.js" defer></script>
  <script src="https://unpkg.com/idiomorph@0.8.0/dist/idiomorph.min.js" defer></script>
  <script src="/assets/preview.js" data-resolve-relations="{{join .ResolveRelations ","}}" defer></script>
  {{- end}}
</head>
<body>
  {{with .Config}}{{template "site_header" .}}{{end}}
  <main id="main" data-preview-root>{{render .Content}}</main>
  {{with .Config}}{{template "site_footer" .}}{{end}}
</body>
</html>
{{- end}}
