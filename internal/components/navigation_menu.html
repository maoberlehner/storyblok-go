{{define "navigation_menu" -}}
<li class="site-nav__item site-nav__item--dropdown" {{editable .}}>
  <a class="site-nav__link" href="{{.Link.Href}}">{{.Display}}{{template "icon_chevron_down"}}</a>
  {{- with .NavItems}}
  <div class="site-subnav">
    <div class="site-subnav__inner">{{renderAll .}}</div>
  </div>
  {{- end}}
</li>
{{- end}}
