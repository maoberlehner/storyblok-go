{{define "block-section-cta" -}}
<section {{editable .}} class="{{section .}}" aria-labelledby="{{id .}}-heading">
  <div class="block-section-cta__layout">
    <div class="block-section-cta__content">
      <h2 class="block-section-cta__heading" id="{{id .}}-heading">{{.Heading}}</h2>
      {{with .Text}}<p class="block-section-cta__text">{{.}}</p>{{end}}
    </div>
    {{with .Button}}{{base "base-button" .}}{{end}}
  </div>
</section>
{{- end}}
