include /etc/nginx/modules/*.conf;

worker_processes auto;
pid /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    log_format cache '$remote_addr "$request" $status $body_bytes_sent '
                     'cache=$upstream_cache_status upstream=$upstream_status $upstream_response_time';
    access_log /var/log/nginx/access.log cache;

    # Compression runs after the cache, so cached entries stay uncompressed and
    # serve every encoding. text/html is always included.
    brotli on;
    brotli_comp_level 5;
    brotli_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # inactive bounds how long unused pages are kept for stale serving.
    proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:10m
                     max_size=1g inactive=1d use_temp_path=off;

    upstream app {
        server app:8080;
        keepalive 32;
    }

    # Visual Editor requests carry _storyblok* parameters and must always reach
    # the app.
    map $args $is_preview {
        "~(^|&)_storyblok" 1;
        default 0;
    }

    # Pages are cached only when the app marks them with CDN-Cache-Control.
    map $upstream_http_cdn_cache_control $not_cacheable {
        "" 1;
        default 0;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Keeps the port, so the app's cross-origin check can match Origin
        # against Host.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache pages;
        # htmx requests get a fragment of the page at the same URL.
        proxy_cache_key $host$request_uri$http_hx_request;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        add_header X-Cache-Status $upstream_cache_status always;

        # Follows the app's Cache-Control, which marks hashed assets immutable.
        location /assets/ {
            proxy_pass http://app;
        }

        location / {
            proxy_pass http://app;
            proxy_cache_bypass $is_preview;
            proxy_no_cache $is_preview $not_cacheable;

            # Cache-Control is meant for browsers. nginx cannot read
            # CDN-Cache-Control, so these directives mirror the app's policy:
            # fresh for 10s, then served stale while one background request
            # revalidates, and while the app fails.
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header CDN-Cache-Control;
            proxy_cache_valid 200 10s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
        }
    }
}
